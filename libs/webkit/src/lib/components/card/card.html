<!-- Card component template -->
<div class="character-card">
  <!-- Image side of the card -->
  <div class="image-side" [class]="'rarity-' + rarityValue()">
    <img
      [src]="image()"
      [alt]="name()"
      tabindex="0"
      (keyup.enter)="imageClick.emit()"
      (click)="imageClick.emit()"
    />
  </div>

  <!-- Info content side of the card -->
  <div class="info-content">
    <div class="header-row">
      <span class="rarity-stars">{{ starIcon() }}</span>
      <h2
        class="name-text"
        role="button"
        tabindex="0"
        (click)="nameClick.emit()"
        (keyup.enter)="nameClick.emit()"
      >
        {{ name() }}
      </h2>
    </div>

    <!-- Badges slot -->
    <ng-content select="[badges]"></ng-content>

    <!-- Stats slot -->
    <div class="stats-slot">
      <ng-content select="[stats]"></ng-content>
    </div>

    <!-- Footer slot -->
    <div class="footer-slot">
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</div>
