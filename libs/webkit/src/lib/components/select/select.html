<!-- Select component template -->
<div class="hsr-input-wrapper">

  <!-- Select element for choosing an option -->
  <select
    [id]="selectId"
    [value]="value()"
    [disabled]="disabled()"
    (change)="onSelectionChange($event)"
    class="hsr-select"
  >

  <!-- Option for selecting all items -->
    @if (label()) {
      <option value="">All {{ label() }}</option>
    }

    <!-- Options for each item in the list -->
    @for (opt of options(); track getOptionValue(opt)) {
      <option
        [value]="getOptionValue(opt)"
        [selected]="getOptionValue(opt) === value()"
      >
        {{ getOptionLabel(opt) }}
      </option>
    }
  </select>
</div>
