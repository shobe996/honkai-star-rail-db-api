<!-- Paginator component template -->
<div class="paginator-container">

  <!-- Information about the current range of items -->
  <div class="paginator-info">

    <!-- Display the current range of items -->
    Showing <strong>{{ startRange() }}</strong> -
    <strong>{{ endRange() }}</strong>
    of <strong>{{ total() }}</strong> {{ label() }}
  </div>

  <!-- Controls for pagination and page size selection -->
  <div class="paginator-controls">

    <!-- Page size selection -->
    <div class="size-selector">
      <span>Rows per page:</span>
      <lib-select
        class="paginator-select"
        [options]="pageSizeOptions"
        labelKey="name"
        valueKey="id"
        [value]="sizeSignal()"
        (valueChange)="handleSizeChange($event)"
      />
    </div>

    <!-- Navigation buttons for first, previous, next, and last pages -->
    <div class="page-nav">

      <!-- First page button -->
      <lib-button
        variant="nav"
        [isEdge]="true"
        [disabled]="page() === 1"
        (click)="pageChange.emit(1)"
      >
        <span class="arrow">|&laquo;</span>
      </lib-button>

      <!-- Previous page button -->
      <lib-button
        variant="nav"
        [disabled]="page() === 1"
        (click)="pageChange.emit(page() - 1)"
      >
        <span class="arrow">&laquo;</span> PREV
      </lib-button>

      <span class="page-indicator">
        PAGE <strong>{{ page() }}</strong> / {{ lastPage() }}
      </span>

      <!-- Next page button -->
      <lib-button
        variant="nav"
        [disabled]="!hasMore()"
        (click)="pageChange.emit(page() + 1)"
      >
        NEXT <span class="arrow">&raquo;</span>
      </lib-button>

      <!-- Last page button -->
      <lib-button
        variant="nav"
        [isEdge]="true"
        [disabled]="page() === lastPage()"
        (click)="pageChange.emit(lastPage())"
      >
        <span class="arrow">&raquo;|</span>
      </lib-button>
    </div>
  </div>
</div>
