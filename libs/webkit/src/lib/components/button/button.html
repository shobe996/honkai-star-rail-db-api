<button 
  [disabled]="disabled()" 
  [type]="type()"
  class="hsr-button-base"
  [class]="variant()"
  [class.edge-nav]="variant() === 'nav' && isEdge()"
  [ngClass]="{
    'primary': variant() === 'primary',
    'secondary': variant() === 'secondary',
    'reset': variant() === 'reset',
    'nav': variant() === 'nav',
    'edge-nav': variant() === 'nav' && isEdge(),
    'round': variant() === 'round',
    'active': active()
  }"
  >
  
  <!-- <span class="button-content"> -->
    <ng-content></ng-content>
  <!-- </span> -->

  @if (variant() === 'primary' || variant() === 'reset') {
    <div class="hsr-border-accent"></div>
  }
</button>
