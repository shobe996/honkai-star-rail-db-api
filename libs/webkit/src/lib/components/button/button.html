<!-- Button component template -->
<button
  [disabled]="disabled()"
  [type]="type()"
  class="hsr-button-base"
  [class]="variant()"
  [class.edge-nav]="variant() === 'nav' && isEdge()"
  [ngClass]="{
    'primary': variant() === 'primary',
    'secondary': variant() === 'secondary',
    'reset': variant() === 'reset',
    'nav': variant() === 'nav',
    'edge-nav': variant() === 'nav' && isEdge(),
    'round': variant() === 'round',
    'active': active()
  }"
>
  <!-- Button content -->
  <ng-content></ng-content>

  <!-- Border accent for primary and reset variants -->
  @if (variant() === 'primary' || variant() === 'reset') {
  <div class="hsr-border-accent"></div>
  }
</button>
