<!-- Planar Ornament Detail Page -->
<div class="page-wrapper">

  <!-- Planar Ornament Artwork and Information Container -->
  <div class="detail-container">

    <!-- Left Artwork Viewport -->
    <div class="artwork-viewport">
      <div class="ornament-grid-showcase">

        <!-- Planar Ornament Piece Card: Sphere -->
        <div class="ornament-piece-card">
          <img
            [src]="planarOrnament().icons.sphere_icon_url"
            alt="Sphere"
            class="piece-art"
          />
          <span class="piece-label">SPHERE</span>
        </div>

        <!-- Planar Ornament Piece Card: Rope -->
        <div class="ornament-piece-card">
          <img
            [src]="planarOrnament().icons.rope_icon_url"
            alt="Rope"
            class="piece-art"
          />
          <span class="piece-label">ROPE</span>
        </div>
      </div>

      <div class="name-overlay-bg">{{ planarOrnament().name }}</div>
    </div>

    <!-- Right Information Panel -->
    <div class="info-pane">

      <!-- Planar Ornament Header -->
      <header class="ornament-header">
        <span class="set-type-tag">{{ planarOrnament().set }}</span>
        <h1 class="bold-name">{{ planarOrnament().name }}</h1>
      </header>

      <!-- Set Effects Panel -->
      <section class="set-effects-panel">
        <div class="effect-group">
          <span class="effect-badge">2-PIECE SET</span>
          <p class="effect-description">
            {{ planarOrnament().two_set_effect }}
          </p>
        </div>
      </section>
    </div>
  </div>
</div>
