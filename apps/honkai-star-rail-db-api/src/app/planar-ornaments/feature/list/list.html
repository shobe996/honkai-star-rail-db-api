<!-- Planar Ornaments List Page -->
<div class="page-container">
  <!-- Filter Bar for Searching and Sorting Planar Ornaments -->
  <lib-filter-bar (resetFilters)="resetFilters()">
    <!-- Search by Planar Ornament Name -->
    <lib-input
      placeholder="Search ornament name..."
      [formField]="searchForm.name"
    />

    <!-- Search by Planar Ornament Effect -->
    <lib-input
      placeholder="Search by ornament effect..."
      [formField]="searchForm.effect"
    />

    <!-- Sort By Dropdown -->
    <lib-select
      [options]="sortByOptions"
      labelKey="label"
      valueKey="value"
      label="Sort By"
      [formField]="searchForm.sortBy"
    />

    <!-- Sort Direction Dropdown -->
    <lib-select
      [options]="sortDirectionOptions"
      labelKey="label"
      valueKey="value"
      label="Sort Direction"
      [formField]="searchForm.sortDirection"
    />
  </lib-filter-bar>

  <!-- PlanarOrnaments Card List -->
  <div class="card-list">
    @for (ornament of planarOrnaments().data; track ornament.id) {

    <!-- Individual Planar Ornament Card -->
    <lib-card
      [rarityValue]="5"
      [image]="ornament.icons.icon_url"
      [name]="ornament.name"
      (imageClick)="toDetails(ornament)"
      (nameClick)="toDetails(ornament)"
    >
      <!-- Planar Ornament Effects Section -->
      <div stats class="effects-section">
        <div class="effect-box">
          <span class="effect-label">2-PIECE SET</span>
          <p class="effect-text">{{ ornament.two_set_effect }}</p>
        </div>
      </div>

      <!-- Planar Ornament Footer -->
      <div footer class="ornament-footer">{{ ornament.set }}</div>
    </lib-card>
    }
  </div>

  <!-- Paginator for Navigating Through Planar Ornaments -->
  <lib-paginator
    [total]="planarOrnaments().total"
    [size]="currentSize()"
    [page]="currentPage()"
    [hasMore]="planarOrnaments().hasMore"
    label="Planar Ornaments"
    (pageChange)="goToPage($event)"
    (sizeChange)="updatePageSize($event)"
  />
</div>
