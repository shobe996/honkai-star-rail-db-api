<!-- Light Cone Detail Page -->
<div class="page-wrapper">

  <!-- Light Cone Artwork and Information Container -->
  <div class="detail-container">

    <!-- Left Artwork Viewport -->
    <div class="artwork-viewport">
      <img
        [src]="lightCone().full_artwork_url"
        class="splash-art"
        [alt]="lightCone().name"
      />
      <div class="name-overlay-bg">{{ lightCone().name }}</div>
    </div>

    <!-- Right Information Panel -->
    <div class="info-pane">

      <!-- Light Cone Header -->
      <header class="char-header">
        <div class="rarity-row">{{ lightCone().rarity.icon }}</div>
        <h1 class="bold-name">{{ lightCone().name }}</h1>

        <div class="badge-row">
          <lib-badge
            [icon]="lightCone().path.icon_url"
            [label]="lightCone().path.name"
            variant="detail"
          ></lib-badge>
        </div>
      </header>

      <!-- Light Cone Description -->
      <div class="description-scroll">
        <div
          [innerHTML]="lightCone().effect"
          class="flavor-text"
        ></div>
      </div>

      <!-- Light Cone Base Stats -->
      <section class="stats-panel">

        <!-- Base Stats Header -->
        <div class="stats-header">

          <!-- Base Stats Label and Level Selector -->
          <span class="label">BASE STATS</span>
          <div class="level-selector">
            <!-- Level 1 Button -->
            <lib-button
              variant="round"
              [active]="currentLevel === 'level1'"
              (click)="toggleLevel('level1')"
            >
              01
            </lib-button>

            <!-- Level 80 Button -->
            <lib-button
              variant="round"
              [active]="currentLevel === 'level80'"
              (click)="toggleLevel('level80')"
            >
              80
            </lib-button>
          </div>
        </div>

        <!-- Base Stats Grid -->
        <div class="stat-grid-3col">
          <!-- HP Stat -->
          <div class="stat-box">
            <span class="stat-label">HP</span>
            <span class="stat-value">{{ activeStats.base_hp }}</span>
          </div>
          <!-- ATK Stat -->
          <div class="stat-box">
            <span class="stat-label">ATK</span>
            <span class="stat-value">{{ activeStats.base_atk }}</span>
          </div>
          <!-- DEF Stat -->
          <div class="stat-box">            
            <span class="stat-label">DEF</span>
            <span class="stat-value">{{ activeStats.base_def }}</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
